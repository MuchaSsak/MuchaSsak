# Draws the contribution-grid snake at the bottom of the README and pushes it to the `output` branch.
name: snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2433ff&color_dots=#eef0ff,#c9cdff,#8a92ff,#4a55ff,#2433ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4fb8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
